<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>

<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

// ---------- parâmetros ajustáveis
const DEF = {
  grav: 1.4, dropH: 0.7, impact: 2.4, roamSpeed: 0.5,
  rollSlow: 0.25, rollFast: 1.4, jumpH: 0.9, jumpSpin: 24,
  boomForce: 1.0, boomReturn: 0.9, contractT: 0.75,
  fling: 1.0, looseT: 2.0, spring: 260,
  bloom: 0.85, size: 0.0034,
  cBody: '#ff5c0f', cBody2: '#ff8c26', cSeam: '#2ef2ff', cGlow: '#ff6a1a'
};
const SLIDERS = [
  ['Quique'],
  ['grav', 'Gravidade (menor = mais tempo no ar)', 0.5, 9.8, 0.1, 'm/s²'],
  ['dropH', 'Altura do quique', 0.1, 1.5, 0.01, 'm'],
  ['impact', 'Força do impacto nas partículas', 0, 6, 0.1, ''],
  ['roamSpeed', 'Velocidade pelo ambiente', 0.2, 2.5, 0.05, 'm/s'],
  ['Rolar e pular'],
  ['rollSlow', 'Rolar devagar', 0.05, 1, 0.01, 'm/s'],
  ['rollFast', 'Rolar rápido', 0.5, 3.5, 0.05, 'm/s'],
  ['jumpH', 'Altura do pulo', 0.2, 2, 0.05, 'm'],
  ['jumpSpin', 'Giro do pulo', 5, 60, 1, 'rad/s'],
  ['Explosão'],
  ['boomForce', 'Força da explosão', 0.2, 3, 0.05, '×'],
  ['boomReturn', 'Velocidade de volta (ímã)', 0.15, 3, 0.05, 'm/s'],
  ['contractT', 'Tempo de contração', 0.2, 2, 0.05, 's'],
  ['Partículas'],
  ['fling', 'Desgarre no giro', 0, 5, 0.1, '×'],
  ['looseT', 'Tempo para voltar (soltas)', 0.5, 8, 0.1, 's'],
  ['spring', 'Elasticidade da forma', 60, 600, 10, ''],
  ['bloom', 'Brilho neon', 0, 2.5, 0.05, ''],
  ['size', 'Tamanho das partículas', 0.0015, 0.008, 0.0001, '']
];
const P = {...DEF};

const R = 0.12, REST = 0.8, WALL = 0.9, ROLL_R = 0.38;
const N = 22000;
const CREL = 13, CABS = 0.6, SPREAD = 0.00045, GRAV_P = -1.0, DRAG = 2.3, STOP_V = 0.05, MAG_GAIN = 2.2, MAG_RAMP = 1.3;

// ---------- cena
const renderer = new THREE.WebGLRenderer({antialias: false});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060a);
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 50);
let camDist = 1.4;
const LOOK = new THREE.Vector3(0, 0.22, 0);
let camH = 0;
function placeCam() {
  const fit = Math.max(1, 0.9 / cam.aspect);
  const d = camDist * fit * (1 + camH * 0.7);
  cam.position.set(LOOK.x, LOOK.y + d * 0.3, LOOK.z + d);
  cam.lookAt(LOOK);
}
placeCam();

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, cam));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), P.bloom, 0.35, 0.12);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const grid = new THREE.GridHelper(8, 80, 0x1b2a3a, 0x0e1520);
grid.material.transparent = true; grid.material.opacity = 0.55;
scene.add(grid);
function glowTex() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
const glow = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({map: glowTex(), color: 0xff6a1a, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false}));
glow.rotation.x = -Math.PI / 2; glow.position.y = 0.001; scene.add(glow);
// limites da arena (só aparecem no modo "pelo ambiente")
const arena = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(WALL * 2 + R * 2, 0.002, WALL * 2 + R * 2)), new THREE.LineBasicMaterial({color: 0x2ff0ff, transparent: true, opacity: 0}));
arena.position.y = 0.001; scene.add(arena);

// ---------- partículas
function seamDist(x, y, z) {
  const d = Math.min(Math.abs(x), Math.abs(y));
  const c = Math.abs(Math.abs(z) - (0.62 + 0.30 * (y * y - x * x)));
  return Math.min(d, c * 0.85);
}
function randUnit(out) {
  const u = Math.random() * 2 - 1, t = Math.random() * Math.PI * 2, s = Math.sqrt(1 - u * u);
  out[0] = s * Math.cos(t); out[1] = u; out[2] = s * Math.sin(t);
}
const rest = new Float32Array(N * 3), pos = new Float32Array(N * 3), vel = new Float32Array(N * 3);
const col = new Float32Array(N * 3), stiff = new Float32Array(N), seamFlag = new Uint8Array(N), loose = new Float32Array(N);
const mode = new Uint8Array(N), magT = new Float32Array(N), varr = new Float32Array(N);
const tmp = [0, 0, 0];
for (let k = 0; k < N; k++) varr[k] = Math.random() * 0.6;
const stiffR = new Float32Array(N).map(() => Math.random());

// ---------- formas (pontos em unidades do raio R)
function makeShape(nAcc, bodyFn, accFn) {
  const r = new Float32Array(N * 3), f = new Uint8Array(N), o = [0, 0, 0];
  for (let k = 0; k < N; k++) {
    const acc = k >= N - nAcc;
    (acc ? accFn : bodyFn)(o, k); r[k * 3] = o[0]; r[k * 3 + 1] = o[1]; r[k * 3 + 2] = o[2]; f[k] = acc ? 1 : 0;
  }
  return {rest: r, flag: f};
}
const TAU = Math.PI * 2, rnd = (a, b) => a + Math.random() * (b - a);
const SHAPES = {};
// 1) bola de basquete
SHAPES.bola = () => {
  const nAcc = 6000, nB = N - nAcc, golden = Math.PI * (3 - Math.sqrt(5)), M = Math.round(nB * 1.25), pts = [];
  for (let k = 0; k < M && pts.length < nB; k++) {
    const yy = 1 - (k + 0.5) / M * 2, rr = Math.sqrt(1 - yy * yy), th = golden * k;
    const x = rr * Math.cos(th), z = rr * Math.sin(th);
    if (seamDist(x, yy, z) >= 0.03) pts.push([x, yy, z]);
  }
  while (pts.length < nB) { randUnit(tmp); if (seamDist(...tmp) >= 0.03) pts.push([...tmp]); }
  return makeShape(nAcc, (o, k) => { o[0] = pts[k][0]; o[1] = pts[k][1]; o[2] = pts[k][2]; },
    o => { do randUnit(o); while (seamDist(o[0], o[1], o[2]) > 0.016); o[0] *= 0.985; o[1] *= 0.985; o[2] *= 0.985; });
};
// 2) cubo: faces no corpo, arestas em destaque
SHAPES.cubo = () => {
  const a = 0.66;
  return makeShape(5500, o => {
    const face = Math.floor(Math.random() * 6), ax = face >> 1, sg = face & 1 ? 1 : -1, u = rnd(-a, a), v = rnd(-a, a);
    o[ax] = sg * a; o[(ax + 1) % 3] = u; o[(ax + 2) % 3] = v;
  }, o => {
    const e = Math.floor(Math.random() * 12), ax = e >> 2, s1 = e & 1 ? 1 : -1, s2 = e & 2 ? 1 : -1;
    o[ax] = rnd(-a, a); o[(ax + 1) % 3] = s1 * a; o[(ax + 2) % 3] = s2 * a;
  });
};
// 3) rosquinha (toro)
SHAPES.rosquinha = () => {
  const Rm = 0.68, r = 0.32;
  const P = (u, v, o) => { o[0] = (Rm + r * Math.cos(v)) * Math.cos(u); o[2] = (Rm + r * Math.cos(v)) * Math.sin(u); o[1] = r * Math.sin(v); };
  return makeShape(5500, o => {
    let u, v; do { u = rnd(0, TAU); v = rnd(0, TAU); } while (Math.random() > (Rm + r * Math.cos(v)) / (Rm + r));
    P(u, v, o);
  }, o => {
    if (Math.random() < 0.5) P(Math.floor(Math.random() * 8) / 8 * TAU, rnd(0, TAU), o);
    else P(rnd(0, TAU), Math.floor(Math.random() * 3) / 3 * TAU + 0.3, o);
    o[0] *= 1.01; o[1] *= 1.01; o[2] *= 1.01;
  });
};
// 4) nó (torus knot 2,3) com uma faixa em espiral
SHAPES.no = () => {
  const s = 0.3, tr = 0.115, C = (t, o) => { const c = 2 + Math.cos(3 * t); o[0] = s * c * Math.cos(2 * t); o[1] = s * c * Math.sin(2 * t); o[2] = s * Math.sin(3 * t); };
  const A = [0, 0, 0], B = [0, 0, 0], T = new THREE.Vector3(), Nn = new THREE.Vector3(), Bn = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0);
  const tube = (t, phi, rad, o) => {
    C(t - 1e-3, A); C(t + 1e-3, B); T.set(B[0] - A[0], B[1] - A[1], B[2] - A[2]).normalize();
    Nn.crossVectors(T, up.set(0, 0, 1)); if (Nn.lengthSq() < 1e-6) Nn.set(1, 0, 0); Nn.normalize(); Bn.crossVectors(T, Nn);
    C(t, o); const c = Math.cos(phi) * rad, sn = Math.sin(phi) * rad;
    o[0] += Nn.x * c + Bn.x * sn; o[1] += Nn.y * c + Bn.y * sn; o[2] += Nn.z * c + Bn.z * sn;
  };
  return makeShape(5000, o => tube(rnd(0, TAU), rnd(0, TAU), tr, o), o => { const t = rnd(0, TAU); tube(t, t * 5 + (Math.random() < 0.5 ? 0 : Math.PI), tr * 1.02, o); });
};
// 5) hélice de DNA: duas fitas e os pares de bases
SHAPES.dna = () => {
  const H = 1.0, rd = 0.42, turns = 1.6, tubeR = 0.06, rungs = 22;
  const ang = y => (y + H) / (2 * H) * turns * TAU;
  return makeShape(7000, o => {
    const y = rnd(-H, H), th = ang(y) + (Math.random() < 0.5 ? 0 : Math.PI), ph = rnd(0, TAU);
    const cx = rd * Math.cos(th), cz = rd * Math.sin(th);
    o[0] = cx + Math.cos(ph) * tubeR * Math.cos(th); o[2] = cz + Math.cos(ph) * tubeR * Math.sin(th); o[1] = y + Math.sin(ph) * tubeR;
  }, o => {
    const j = Math.floor(Math.random() * rungs), y = -H + (j + 0.5) / rungs * 2 * H, th = ang(y), t = rnd(-1, 1) * (rd - tubeR);
    const ph = rnd(0, TAU), w = 0.025;
    o[0] = Math.cos(th) * t + Math.cos(ph) * w * -Math.sin(th); o[2] = Math.sin(th) * t + Math.cos(ph) * w * Math.cos(th); o[1] = y + Math.sin(ph) * w;
  });
};
// 6) logo IMPULSO: letras desenhadas num canvas e amostradas
SHAPES.impulso = () => {
  const W = 1200, Hh = 260, c = document.createElement('canvas'); c.width = W; c.height = Hh;
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.font = '900 210px Arial Black, Arial, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('IMPULSO', W / 2, Hh / 2 + 8);
  const d = g.getImageData(0, 0, W, Hh).data, fill = [], edge = [];
  const on = (x, y) => x >= 0 && y >= 0 && x < W && y < Hh && d[(y * W + x) * 4 + 3] > 128;
  let minX = W, maxX = 0;
  for (let y = 0; y < Hh; y += 1) for (let x = 0; x < W; x += 1) if (on(x, y)) {
    fill.push(x, y); minX = Math.min(minX, x); maxX = Math.max(maxX, x);
    if (!on(x - 2, y) || !on(x + 2, y) || !on(x, y - 2) || !on(x, y + 2)) edge.push(x, y);
  }
  const sc = 4.6 / (maxX - minX), cx = (minX + maxX) / 2, cy = Hh / 2, depth = 0.16;
  const map = (arr, o, zr) => { const j = Math.floor(Math.random() * arr.length / 2) * 2; o[0] = (arr[j] + Math.random() - cx) * sc; o[1] = -(arr[j + 1] + Math.random() - cy) * sc; o[2] = zr; };
  return makeShape(6500, o => map(fill, o, (Math.random() < 0.5 ? -1 : 1) * depth * (0.6 + 0.4 * Math.random())), o => map(edge, o, rnd(-depth, depth)));
};
const SHAPE_NAMES = {bola: 'Bola', cubo: 'Cubo', rosquinha: 'Rosquinha', no: 'Nó', dna: 'Hélice DNA', impulso: 'IMPULSO'};
const shapeCache = {};
let shape = 'bola';
function loadShape(name) {
  const S = shapeCache[name] || (shapeCache[name] = SHAPES[name]());
  rest.set(S.rest); seamFlag.set(S.flag);
  for (let k = 0; k < N; k++) stiff[k] = seamFlag[k] ? 1.2 + stiffR[k] * 0.4 : 0.75 + stiffR[k] * 0.5;
  shape = name;
}
loadShape('bola');
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage));
geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
const mat = new THREE.PointsMaterial({size: P.size, map: glowTex(), alphaTest: 0.01, vertexColors: true, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true});
const points = new THREE.Points(geo, mat);
points.frustumCulled = false;
scene.add(points);

// ---------- bola
const ball = {p: new THREE.Vector3(0, R, 0), v: new THREE.Vector3(), q: new THREE.Quaternion(), w: new THREE.Vector3(0, 0.6, 0), squash: 0, mode: 'idle', rollSp: 0};
window.ball = ball;
for (let k = 0; k < N; k++) { pos[k * 3] = rest[k * 3] * R; pos[k * 3 + 1] = rest[k * 3 + 1] * R + R; pos[k * 3 + 2] = rest[k * 3 + 2] * R; }
const vDrop = () => Math.sqrt(2 * P.grav * P.dropH);

function impulse(strength, dir) {
  // dir: 'down' (chão), 'all' (explosão leve) ou um vetor normal de parede
  for (let k = 0; k < N; k++) {
    const rx = pos[k * 3] - ball.p.x, ry = pos[k * 3 + 1] - ball.p.y, rz = pos[k * 3 + 2] - ball.p.z;
    const l = Math.hypot(rx, ry, rz) || 1;
    let f = strength * (0.6 + Math.random() * 0.8);
    if (dir === 'down') f *= Math.max(0, -ry / l) ** 1.5 * 2.2 + 0.15;
    else if (dir && dir.isVector3) f *= Math.max(0, -(rx * dir.x + rz * dir.z) / l) ** 1.5 * 2.2 + 0.1;
    if (f < 0.02) continue;
    vel[k * 3] += rx / l * f; vel[k * 3 + 1] += ry / l * f * (dir === 'down' ? 0.4 : 1) + (dir === 'down' ? f * 0.5 : 0); vel[k * 3 + 2] += rz / l * f;
    loose[k] = Math.min(1, Math.max(loose[k], f / Math.max(strength, 1e-3) * 0.75));
  }
}

// ---------- girar com o gesto
const el = renderer.domElement;
let dragging = false, last = null, samples = [];
const AX = new THREE.Vector3(), dq = new THREE.Quaternion();
el.addEventListener('pointerdown', e => { dragging = true; el.classList.add('drag'); el.setPointerCapture(e.pointerId); last = {x: e.clientX, y: e.clientY, t: e.timeStamp}; samples = []; ball.w.multiplyScalar(0.2); });
el.addEventListener('pointermove', e => {
  if (!dragging) return;
  const now = e.timeStamp, dx = e.clientX - last.x, dy = e.clientY - last.y, dt = Math.max(1, now - last.t) / 1000;
  const k = 2.6 / Math.min(innerWidth, innerHeight) * Math.PI;
  AX.set(dy, dx, 0); const ang = AX.length() * k;
  if (ang > 0) {
    AX.normalize().applyQuaternion(cam.quaternion);
    dq.setFromAxisAngle(AX, ang); ball.q.premultiply(dq);
    samples.push({w: AX.clone().multiplyScalar(ang / dt), t: now});
  }
  samples = samples.filter(s => now - s.t < 150);
  last = {x: e.clientX, y: e.clientY, t: now};
});
function release(e) {
  if (!dragging) return; dragging = false; el.classList.remove('drag');
  const now = e && e.timeStamp ? e.timeStamp : performance.now();
  let recent = samples.filter(s => now - s.t < 150);
  if (!recent.length && samples.length && now - samples[samples.length - 1].t < 300) recent = samples.slice(-3);
  if (recent.length) {
    const w = new THREE.Vector3(); recent.forEach(s => w.add(s.w)); w.divideScalar(recent.length);
    if (w.length() > 60) w.setLength(60);
    ball.w.copy(w);
    if (ball.mode === 'rollSlow' || ball.mode === 'rollFast') setMode('idle');
  }
}
el.addEventListener('pointerup', release); el.addEventListener('pointercancel', release);
el.addEventListener('wheel', e => { camDist = THREE.MathUtils.clamp(camDist * (1 + e.deltaY * 0.001), 0.45, 4); e.preventDefault(); }, {passive: false});

// ---------- botões
const $ = id => document.getElementById(id);
const modeBtns = [...document.querySelectorAll('[data-mode]')];
function setMode(m) {
  if (ball.mode === m) m = 'idle';
  ball.mode = m;
  modeBtns.forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  const onFloor = ball.p.y <= R + 1e-3;
  if (m === 'bounce' && onFloor) ball.v.y = vDrop();
  if (m === 'roam') {
    const a = Math.random() * Math.PI * 2, s = P.roamSpeed;
    ball.v.x = Math.cos(a) * s; ball.v.z = Math.sin(a) * s;
    if (onFloor) ball.v.y = vDrop();
  }
  if (m === 'rollSlow' || m === 'rollFast') ball.rollSp = Math.hypot(ball.v.x, ball.v.z);
}
modeBtns.forEach(b => b.onclick = () => setMode(b.dataset.mode));
$('jump').onclick = () => {
  if (ball.mode !== 'idle') setMode('idle');
  ball.v.y = Math.sqrt(2 * P.grav * P.jumpH);
  const a = Math.random() * Math.PI * 2;
  ball.w.set(Math.cos(a) * P.jumpSpin, P.jumpSpin * 0.35, Math.sin(a) * P.jumpSpin);
  impulse(P.impact * 0.6, 'down');
};
const boom = {phase: 0, t: 0, active: 0};
$('home').onclick = () => {
  if (ball.mode !== 'idle') setMode('idle');
  ball.p.set(0, R, 0); ball.v.set(0, 0, 0); ball.w.set(0, 0.6, 0); ball.q.identity(); ball.squash = 0; ball.rollSp = 0;
  boom.t = 0; if (boom.phase === 1) boom.phase = 0;
  // as partículas voltam até a bola pelo efeito ímã
  for (let k = 0; k < N; k++) { mode[k] = 2; magT[k] = 0.4; loose[k] = 0; }
  boom.phase = 2; $('boom').classList.remove('on');
};
$('boom').onclick = () => { if (boom.phase) return; boom.phase = 1; boom.t = 0; $('boom').classList.add('on'); };
function burst() {
  for (let k = 0; k < N; k++) {
    const k3 = k * 3;
    let dx = pos[k3] - ball.p.x, dy = pos[k3 + 1] - ball.p.y, dz = pos[k3 + 2] - ball.p.z;
    const l = Math.hypot(dx, dy, dz) || 1;
    dx = dx / l + (Math.random() - 0.5) * 0.35; dy = dy / l + (Math.random() - 0.5) * 0.35 + 0.15; dz = dz / l + (Math.random() - 0.5) * 0.35;
    const v0 = (0.55 + Math.random() * 0.85) * (seamFlag[k] ? 1.15 : 1) * P.boomForce;
    vel[k3] = dx * v0; vel[k3 + 1] = dy * v0; vel[k3 + 2] = dz * v0;
    mode[k] = 1; loose[k] = 0;
  }

}

// ---------- painel de ajustes
const box = $('sliders'), inputs = {};
for (const s of SLIDERS) {
  if (s.length === 1) { const g = document.createElement('div'); g.className = 'grp'; g.textContent = s[0]; box.appendChild(g); continue; }
  const [key, label, min, max, step, unit] = s;
  const lab = document.createElement('label'); lab.textContent = label + (unit ? ` (${unit})` : '');
  const row = document.createElement('div'); row.className = 'row';
  const inp = document.createElement('input'); Object.assign(inp, {type: 'range', min, max, step, value: P[key]});
  const out = document.createElement('output');
  const dec = step < 0.001 ? 4 : step < 0.01 ? 3 : step < 0.1 ? 2 : step < 1 ? 1 : 0;
  const show = () => out.textContent = (+inp.value).toFixed(key === 'size' ? 4 : dec);
  inp.oninput = () => { P[key] = +inp.value; show(); apply(); };
  show(); row.append(inp, out); box.append(lab, row); inputs[key] = {inp, show};
}
const C1 = new THREE.Color(), C2 = new THREE.Color(), C3 = new THREE.Color();
function paint() {
  C1.set(P.cBody); C2.set(P.cBody2); C3.set(P.cSeam);
  for (let k = 0; k < N; k++) {
    if (seamFlag[k]) { col[k * 3] = C3.r; col[k * 3 + 1] = C3.g; col[k * 3 + 2] = C3.b; continue; }
    const t = varr[k] / 0.6;
    col[k * 3] = C1.r + (C2.r - C1.r) * t; col[k * 3 + 1] = C1.g + (C2.g - C1.g) * t; col[k * 3 + 2] = C1.b + (C2.b - C1.b) * t;
  }
  geo.attributes.color.needsUpdate = true;
  glow.material.color.set(P.cGlow);
}
function apply() { mat.size = P.size; paint(); }
const COLORS = [['cBody', 'Corpo (tom principal)'], ['cBody2', 'Corpo (variação)'], ['cSeam', 'Costuras'], ['cGlow', 'Brilho no chão']];
{ const g = document.createElement('div'); g.className = 'grp'; g.textContent = 'Cores'; box.prepend(g);
  const holder = document.createElement('div'); g.after(holder);
  for (const [key, label] of COLORS) {
    const r = document.createElement('div'); r.className = 'crow';
    const inp = document.createElement('input'); inp.type = 'color'; inp.value = P[key];
    inp.oninput = () => { P[key] = inp.value; paint(); };
    r.append(Object.assign(document.createElement('span'), {textContent: label}), inp); holder.appendChild(r);
    inputs[key] = {inp, show() {}};
  }
  const pr = document.createElement('div'); pr.className = 'crow'; pr.style.flexWrap = 'wrap'; pr.style.gap = '6px'; pr.style.justifyContent = 'flex-start';
  const PRESETS = {'Basquete': ['#ff5c0f', '#ff8c26', '#2ef2ff', '#ff6a1a'], 'Cyberpunk': ['#ff2bd6', '#7a2bff', '#00fff0', '#ff2bd6'], 'Matrix': ['#00ff66', '#0a8f3c', '#d4ffe0', '#00ff66'], 'Fogo': ['#ff2a00', '#ffd000', '#ffffff', '#ff4a00'], 'Gelo': ['#4fc3ff', '#e8f7ff', '#ffffff', '#4fc3ff']};
  for (const [name, cs] of Object.entries(PRESETS)) {
    const b = document.createElement('button'); b.textContent = name; b.style.padding = '5px 10px'; b.style.fontSize = '12px';
    b.onclick = () => { ['cBody', 'cBody2', 'cSeam', 'cGlow'].forEach((k, j) => { P[k] = cs[j]; inputs[k].inp.value = cs[j]; }); paint(); };
    pr.appendChild(b);
  }
  holder.appendChild(pr);
}
{ // seletor de formas (no topo do painel)
  const g = document.createElement('div'); g.className = 'grp'; g.textContent = 'Forma'; box.prepend(g);
  const row = document.createElement('div'); row.className = 'crow'; row.style.flexWrap = 'wrap'; row.style.gap = '6px'; row.style.justifyContent = 'flex-start'; g.after(row);
  for (const [key, label] of Object.entries(SHAPE_NAMES)) {
    const b = document.createElement('button'); b.textContent = label; b.dataset.shape = key; b.style.padding = '6px 11px'; b.style.fontSize = '13px';
    b.classList.toggle('on', key === shape);
    b.onclick = () => morph(key); row.appendChild(b);
  }
}
function morph(name) {
  if (name === shape) return;
  loadShape(name);
  for (let k = 0; k < N; k++) { mode[k] = 2; magT[k] = 0.15; loose[k] = 0; }
  boom.phase = 2; boom.t = 0; $('boom').classList.remove('on');
  document.querySelectorAll('[data-shape]').forEach(b => b.classList.toggle('on', b.dataset.shape === name));
  paint();
}
$('reset').onclick = () => { Object.assign(P, DEF); for (const k in inputs) { inputs[k].inp.value = P[k]; inputs[k].show(); } apply(); };
paint();
$('tgl').onclick = () => { $('panel').classList.toggle('open'); $('tgl').classList.toggle('on'); };
['pointerdown', 'wheel'].forEach(ev => $('panel').addEventListener(ev, e => e.stopPropagation()));

addEventListener('resize', () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); });

// ---------- simulação
let prev = performance.now();
const tgtPrev = new Float32Array(N * 3); let first = true;
const spd = $('spd'), WN = new THREE.Vector3();
function rollW(out) { return out.set(ball.v.z / R, 0, -ball.v.x / R); }
const RW = new THREE.Vector3(), QI = new THREE.Quaternion();

function stepBall(dt) {
  const isRoll = ball.mode === 'rollSlow' || ball.mode === 'rollFast';
  const keepBounce = ball.mode === 'bounce' || ball.mode === 'roam';
  // rolar: segue um círculo no chão
  if (isRoll) {
    const target = ball.mode === 'rollSlow' ? P.rollSlow : P.rollFast;
    ball.rollSp += (target - ball.rollSp) * Math.min(1, dt * 1.2);
    const r = Math.hypot(ball.p.x, ball.p.z) || 1e-3;
    let th = Math.atan2(ball.p.z, ball.p.x);
    const rN = r + (ROLL_R - r) * Math.min(1, dt * 1.5);
    th += ball.rollSp / ROLL_R * dt;
    const nx = rN * Math.cos(th), nz = rN * Math.sin(th);
    ball.v.x = (nx - ball.p.x) / dt; ball.v.z = (nz - ball.p.z) / dt;
    ball.p.x = nx; ball.p.z = nz;
  }
  // vertical: gravidade e quique
  if (ball.p.y > R + 1e-4 || ball.v.y > 0 || keepBounce) {
    ball.v.y -= P.grav * dt; ball.p.y += ball.v.y * dt;
    if (ball.p.y < R) {
      const impact = -ball.v.y, vd = vDrop();
      ball.p.y = R;
      if (impact > 0.12) {
        impulse(Math.min(impact / vd, 1.6) * P.impact, 'down');
        ball.squash = Math.min(0.24, impact / vd * 0.14);
        ball.v.y = keepBounce ? Math.max(impact * REST, vd) : impact * REST * 0.8;
        if (ball.mode === 'roam') {
          const a = (Math.random() - 0.5) * 0.7, c = Math.cos(a), s = Math.sin(a), vx = ball.v.x, vz = ball.v.z;
          ball.v.x = vx * c - vz * s; ball.v.z = vx * s + vz * c;
          const sp = Math.hypot(ball.v.x, ball.v.z) || 1; ball.v.x *= P.roamSpeed / sp; ball.v.z *= P.roamSpeed / sp;
        }
        if (!dragging && Math.hypot(ball.v.x, ball.v.z) > 0.05) ball.w.lerp(rollW(RW), 0.7);
      } else ball.v.y = 0;
    }
  }
  if (!isRoll) {
    ball.p.x += ball.v.x * dt; ball.p.z += ball.v.z * dt;
    for (const ax of ['x', 'z']) {
      if (Math.abs(ball.p[ax]) > WALL) {
        ball.p[ax] = Math.sign(ball.p[ax]) * WALL; ball.v[ax] *= -0.95;
        WN.set(0, 0, 0); WN[ax] = -Math.sign(ball.p[ax]);
        impulse(Math.abs(ball.v[ax]) / Math.max(P.roamSpeed, 0.2) * P.impact * 0.6, WN.clone());
        ball.squash = Math.max(ball.squash, 0.06);
        ball.w.y += (Math.random() - 0.5) * 3;
      }
    }
    const onFloor = ball.p.y <= R + 1e-3 && Math.abs(ball.v.y) < 1e-3;
    if (onFloor) {
      const f = Math.exp(-dt * 0.9); ball.v.x *= f; ball.v.z *= f;
      if (!dragging && Math.hypot(ball.v.x, ball.v.z) > 0.03) ball.w.copy(rollW(RW));
    }
  } else if (!dragging) ball.w.copy(rollW(RW));
  ball.squash *= Math.exp(-dt * 6);
  // giro livre
  if (!dragging) {
    const wl = ball.w.length();
    if (wl > 1e-4) { AX.copy(ball.w).normalize(); dq.setFromAxisAngle(AX, wl * dt); ball.q.premultiply(dq); }
    if (!isRoll) ball.w.multiplyScalar(Math.exp(-dt * 0.35));
    const facing = shape === 'impulso' || shape === 'no';
    if (facing && ball.mode === 'idle' && wl < 0.6) {
      // texto e nó voltam a ficar de frente para a câmera quando param
      ball.w.multiplyScalar(Math.exp(-dt * 2)); ball.q.slerp(QI, Math.min(1, dt * 1.2));
    } else if (wl < 0.25 && ball.mode === 'idle' && ball.p.y <= R + 1e-3) ball.w.y += (0.35 - ball.w.y) * dt * 0.5;
  }
}

const m3 = new THREE.Matrix3(), qm = new THREE.Matrix4();
function step(dt) {
  stepBall(dt);
  let contract = 1, jit = 0;
  if (boom.phase === 1) {
    boom.t += dt; const c = Math.min(1, boom.t / P.contractT), ce = c * c * c;
    contract = 1 - 0.4 * ce; jit = 0.006 * ce;
    bloom.strength = P.bloom + 1.4 * ce;
    if (c >= 1) burst();
  }
  qm.makeRotationFromQuaternion(ball.q); m3.setFromMatrix4(qm);
  const e = m3.elements, sq = ball.squash, sy = 1 - sq, sxz = 1 + sq * 0.55;
  const wx = ball.w.x, wy = ball.w.y, wz = ball.w.z, w2 = wx * wx + wy * wy + wz * wz;
  const bx = ball.p.x, by = ball.p.y, bz = ball.p.z;
  const isRoll = ball.mode === 'rollSlow' || ball.mode === 'rollFast';
  const flingP = Math.min(0.04, Math.max(0, (w2 - 30) * 0.00004)) * P.fling * dt;
  const decay = Math.exp(-dt / P.looseT), wl = Math.sqrt(w2), fdrag = Math.exp(-DRAG * dt), blendM = 1 - Math.exp(-6 * dt);
  const K = P.spring, MAG_MAX = P.boomReturn;
  let active = 0;
  for (let k = 0; k < N; k++) {
    const k3 = k * 3, rx = rest[k3], ry = rest[k3 + 1], rz = rest[k3 + 2];
    let tx = (e[0] * rx + e[3] * ry + e[6] * rz) * R * sxz;
    let ty = (e[1] * rx + e[4] * ry + e[7] * rz) * R * sy;
    let tz = (e[2] * rx + e[5] * ry + e[8] * rz) * R * sxz;
    if (w2 > 0.5 && !isRoll) {
      const d = (tx * wx + ty * wy + tz * wz) / w2;
      const px = tx - wx * d, py = ty - wy * d, pz = tz - wz * d;
      const f = 1 + Math.min(w2 * SPREAD, 0.3) * (seamFlag[k] ? 0.6 : 1);
      tx = wx * d + px * f; ty = wy * d + py * f; tz = wz * d + pz * f;
    }
    if (contract !== 1) { tx = tx * contract + (Math.random() - 0.5) * jit; ty = ty * contract + (Math.random() - 0.5) * jit; tz = tz * contract + (Math.random() - 0.5) * jit; }
    tx += bx; ty += by; tz += bz;
    const tvx = first ? 0 : (tx - tgtPrev[k3]) / dt, tvy = first ? 0 : (ty - tgtPrev[k3 + 1]) / dt, tvz = first ? 0 : (tz - tgtPrev[k3 + 2]) / dt;
    tgtPrev[k3] = tx; tgtPrev[k3 + 1] = ty; tgtPrev[k3 + 2] = tz;
    let vx = vel[k3], vy = vel[k3 + 1], vz = vel[k3 + 2];
    const md = mode[k];
    if (md) {
      active++;
      if (md === 1) {
        vx *= fdrag; vy *= fdrag; vz *= fdrag;
        if (vx * vx + vy * vy + vz * vz < STOP_V * STOP_V) { mode[k] = 2; magT[k] = 0; }
      } else {
        const ddx = tx - pos[k3], ddy = ty - pos[k3 + 1], ddz = tz - pos[k3 + 2];
        const dist = Math.hypot(ddx, ddy, ddz) || 1e-6;
        const mt = (magT[k] += dt), ramp = Math.min(1, mt / MAG_RAMP), re = ramp * ramp * (3 - 2 * ramp);
        const sp = re * Math.min(MAG_MAX, dist * MAG_GAIN);
        vx += (ddx / dist * sp + tvx - vx) * blendM; vy += (ddy / dist * sp + tvy - vy) * blendM; vz += (ddz / dist * sp + tvz - vz) * blendM;
        if (dist < 0.004) { mode[k] = 0; vx = tvx; vy = tvy; vz = tvz; }

    } else {
      if (flingP > 0 && !dragging && Math.random() < flingP) {
        const ox = pos[k3] - bx, oy = pos[k3 + 1] - by, oz = pos[k3 + 2] - bz, ol = Math.hypot(ox, oy, oz) || 1;
        const kick = wl * R * (0.5 + Math.random() * 1.1);
        vx += (wy * oz - wz * oy) * 0.5 + ox / ol * kick; vy += (wz * ox - wx * oz) * 0.5 + oy / ol * kick * 0.6 + kick * 0.25; vz += (wx * oy - wy * ox) * 0.5 + oz / ol * kick;
        loose[k] = 1;
      }
      let lo = loose[k];
      if (lo > 0.002) { lo *= decay; loose[k] = lo; } else lo = 0;
      const sfac = 1 - 0.97 * lo * lo * (3 - 2 * lo);
      const kk = K * stiff[k] * sfac, cr = CREL * Math.sqrt(sfac * K / 260) + 0.8 * lo;
      vx += (kk * (tx - pos[k3]) - cr * (vx - tvx) - CABS * vx) * dt;
      vy += (kk * (ty - pos[k3 + 1]) - cr * (vy - tvy) - CABS * vy + GRAV_P * lo) * dt;
      vz += (kk * (tz - pos[k3 + 2]) - cr * (vz - tvz) - CABS * vz) * dt;
    }
    let nx = pos[k3] + vx * dt, ny = pos[k3 + 1] + vy * dt, nz = pos[k3 + 2] + vz * dt;
    if (ny < 0.0015) { ny = 0.0015; vy = Math.abs(vy) * 0.3; vx *= 0.9; vz *= 0.9; }
    pos[k3] = nx; pos[k3 + 1] = ny; pos[k3 + 2] = nz; vel[k3] = vx; vel[k3 + 1] = vy; vel[k3 + 2] = vz;
  }
  first = false;
  boom.active = active;
  if (boom.phase === 2 && active === 0) { boom.phase = 0; $('boom').classList.remove('on'); }
}

renderer.setAnimationLoop(now => {
  const frame = Math.min(0.05, (now - prev) / 1000); prev = now;
  const sub = Math.ceil(frame / 0.008), dt = frame / sub;
  for (let s = 0; s < sub; s++) step(dt);
  geo.attributes.position.needsUpdate = true;
  // câmera acompanha a bola com suavidade
  const fk = Math.min(1, frame * 2.2);
  LOOK.x += (ball.p.x * 0.85 - LOOK.x) * fk; LOOK.z += (ball.p.z * 0.85 - LOOK.z) * fk;
  const hT = Math.max(0, ball.p.y - R); camH += (hT - camH) * Math.min(1, frame * 1.5);
  LOOK.y = 0.22 + camH * 0.6;
  placeCam();
  const h = Math.max(0, ball.p.y - R);
  glow.position.x = ball.p.x; glow.position.z = ball.p.z;
  const gs = 0.42 + h * 0.8; glow.scale.set(gs, gs, 1); glow.material.opacity = 0.16 / (1 + h * 6);
  arena.material.opacity += ((ball.mode === 'roam' ? 0.18 : 0) - arena.material.opacity) * Math.min(1, frame * 3);
  if (boom.phase !== 1) bloom.strength += (P.bloom + (boom.phase === 2 ? 0.7 * boom.active / N : 0) - bloom.strength) * Math.min(1, frame * 2);
  const rps = ball.w.length() / (2 * Math.PI);
  spd.textContent = rps > 0.3 ? rps.toFixed(1) + ' voltas/s' : '';
  composer.render();
});
